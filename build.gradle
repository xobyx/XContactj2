// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google() // Added google()
        mavenCentral()
        // maven { url 'https://maven.fabric.io/public' } // Fabric repo removed
        maven { url 'https://plugins.gradle.org/m2/' }


    }
    dependencies {

        classpath 'com.android.tools.build:gradle:8.1.0' // Updated AGP version to 8.1.0
        // classpath 'io.fabric.tools:gradle:1.27.0' // Fabric plugin removed
        // classpath 'gradle.plugin.com.nimbledroid:gradle-profiler:1.0.8' // Commented out for now
        classpath 'com.google.gms:google-services:4.4.0' // Updated Google Services plugin
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9' // Added Firebase Crashlytics plugin

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }

}

allprojects {
    repositories {
        google() // Added google()
        mavenCentral()
        // jcenter() // JCenter is deprecated and should be removed if present elsewhere
    }
}


task clean(type: Delete) {
    delete rootProject.buildDir
}


